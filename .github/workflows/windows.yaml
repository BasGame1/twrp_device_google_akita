name: Build TWRP for Pixel 8a (akita)

on:
  workflow_dispatch:

jobs:
  build:
    # IMPORTANT: Adjust these labels to exactly match your self-hosted runner's labels.
    # Go to your GitHub repo's Settings > Actions > Runners to verify.
    runs-on: [self-hosted, Windows, X64] # <-- Update these labels if yours are different!
    permissions:
      contents: write # Required for actions/upload-artifact

    steps:
      # Step 1: Set up a large swap file to aid with memory-intensive Android builds.
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12 # Allocates 12GB of swap space

      # Step 2: Prepare the Windows environment by installing necessary build tools via Chocolatey.
      # You MUST manually install Chocolatey on your Windows self-hosted runner machine first:
      # https://chocolatey.org/install
      - name: Prepare build environment on Windows
        shell: powershell # Use PowerShell for Windows-native package management
        run: |
          Write-Host "Installing Chocolatey packages..."
          # Update Chocolatey and install essential build tools
          choco upgrade all -y --source "chocolatey"
          choco install -y git make flex bison 7zip python --installargs 'ADD_TO_PATH' --params '"/Python38"'
          choco install -y zulu11.jdk # Zulu OpenJDK 11 for Java development
          choco install -y gnupg curl # curl might be an alias or install the actual curl
          choco install -y sed # GNU sed for Windows
          choco install -y grep # GNU grep for Windows
          choco install -y wget # Useful for downloading files

          # Verify installations
          git --version
          make --version
          java -version
          python --version
          choco --version
          gpg --version
          sed --version
          grep --version

          Write-Host "Environment preparation complete."

      # Step 3: Configure ccache for faster incremental builds.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "${{ github.workflow }}-${{ runner.os }}"
          max-size: 2G # Adjust based on available disk space and build needs

      # Step 4: Download and configure the 'repo' tool.
      # The 'repo' tool is a Python script, but typically executed via Bash.
      - name: Install repo tool
        shell: bash # Use Bash for 'repo' script execution
        run: |
          mkdir -p ~/bin # Create a 'bin' directory in the user's home folder
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo # Download the repo script
          chmod a+x ~/bin/repo # Make it executable
          # Add the 'bin' directory to the PATH for the current shell session
          echo "export PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"
          # Set global Git user configuration
          git config --global user.name "Your Name" # Replace with your name
          git config --global user.email "your-email@example.com" # Replace with your email
          # Verify 'repo' is accessible
          repo version || { echo "Repo not found in PATH. Please verify installation."; exit 1; }

      # Step 5: Initialize the main Android/TWRP repository.
      - name: Initialize repo
        shell: bash # Use Bash
        run: |
          mkdir workspace # Create the main workspace directory for the source code
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        working-directory: ${{ github.workspace }} # Start from the repository's root
        id: pwd_workspace # Capture the absolute path to the workspace for later steps

      # Step 6: Perform the initial repo sync based on the main manifest.
      - name: Initial Repo Sync
        shell: bash # Use Bash
        run: |
          # Use NUMBER_OF_PROCESSORS environment variable for parallel jobs on Windows.
          repo sync -j${{ env.NUMBER_OF_PROCESSORS }} --force-sync
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }} # Navigate to the synced workspace

      # Step 7: Clone your Akita device tree and other necessary common repositories.
      # This assumes your 'device/google/akita' (with vendorsetup.sh & twrp.dependencies)
      # and other Trijal08 repos are in separate GitHub repositories.
      # If they are already part of *this* workflow's repo, you can remove these 'git clone' steps,
      # as the initial 'actions/checkout@v4' at the top of the job would have already pulled them.
      - name: Clone Akita device tree
        shell: bash
        run: |
          # Replace with your actual Akita device tree URL and branch
          git clone https://github.com/YourUser/twrp_device_google_akita.git -b twrp-12.1 device/google/akita
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }}

      - name: Clone common Google device tree (zuma)
        shell: bash
        run: |
          git clone https://github.com/Trijal08/twrp_device_google_zuma.git -b twrp-12.1 device/google/zuma
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }}

      - name: Clone common Google hardware tree
        shell: bash
        run: |
          git clone https://github.com/Trijal08/twrp_hardware_google.git -b twrp-12.1 hardware/google
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }}

      # Step 8: Sync additional device dependencies defined in twrp.dependencies.
      # This step uses 'scripts/convert.sh' (expected in your workflow's repo root)
      # to create a local manifest and then performs another 'repo sync'.
      - name: Sync additional device dependencies
        shell: bash # Use Bash
        run: |
          # 'convert.sh' is expected in your workflow's repo, not the synced Android workspace.
          bash ${{ github.workspace }}/scripts/convert.sh ${{ steps.pwd_workspace.outputs.workspace-folder }}/device/google/akita/twrp.dependencies
          # Perform another 'repo sync' to pull the newly defined projects from the local manifest.
          repo sync -j${{ env.NUMBER_OF_PROCESSORS }} --force-sync
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }}
        continue-on-error: true # Keep this for debugging if dependency sync fails

      # Step 9: Build the TWRP recovery image.
      - name: Build TWRP
        shell: bash # Essential as the Android build system uses Bash/Unix commands.
        run: |
          # Set ccache environment variables.
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          ccache -s # Show ccache statistics

          # Navigate to the main Android source directory.
          cd ${{ steps.pwd_workspace.outputs.workspace-folder }}

          # Source the Android build environment script. This will also source your
          # device/google/akita/vendorsetup.sh file.
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true # Allow missing components if necessary.

          # Lunch the device target and start the build process.
          lunch twrp_akita-eng && make clean && make recoveryimage -j${{ env.NUMBER_OF_PROCESSORS }}
        working-directory: ${{ steps.pwd_workspace.outputs.workspace-folder }}

      # Step 10: Upload the final recovery image as a workflow artifact.
      - name: Upload final recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-akita
          # The path is relative to the working-directory of the build step.
          path: ${{ steps.pwd_workspace.outputs.workspace-folder }}/out/target/product/akita/recovery.img
