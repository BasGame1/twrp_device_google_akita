name: Mission Impossible 69 (Build TWRP for Akita)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # <--- CHANGE: Use ubuntu-24.04 for potentially more base space
    steps:
      # Use the slimhub_actions for cleanup, similar to workflow 2
      # This replaces easimon/maximize-build-space, as you want to adapt workflow 2's strategy
      - name: Cleanup Actions Workspace (using slimhub_actions)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space (adapting from workflow 2)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12 # <--- ADD: Allocate 12GB of swap space

      - name: Initializing environment and installing repo
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3.10 \
            gperf gcc-10-multilib g++-10-multilib lib32ncurses6-dev tree liblz4-tool \
            libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev \
            libncurses6 python3 tar

          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo
          git config --global user.name "Your Name"
          git config --global user.email "your-email@example.com"
          echo "Setting up OpenJDK 11"
          sudo apt-get install -y openjdk-11-jdk

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "${{ github.workflow }}-${{ runner.os }}"
          max-size: 2G # Consider increasing this if space allows later

      - name: Check out your device tree
        uses: actions/checkout@v4
        with:
          path: device/google/akita

      - name: Set up TWRP build environment
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j$(nproc --all)

      - name: Clone hardware-specific repositories
        run: |
          cd ~/twrp
          git clone https://github.com/Trijal08/twrp_device_google_zuma.git -b twrp-12.1 device/google/zuma
          git clone https://github.com/Trijal08/twrp_hardware_google.git -b twrp-12.1 hardware/google

      - name: Link your device tree into the build
        run: |
          # This assumes your device tree for akita is in the current repo,
          # and not cloned from another URL. If it's cloned, the path would be different.
          # Based on your initial problem, it seemed like your device tree was in the same repo.
          cp -r ${GITHUB_WORKSPACE}/device/google/akita/* ~/twrp/device/google/akita/
          # Ensure this path is correct based on where your Akita device tree lives in your GitHub repo.
          # If your local 'device/google/akita' contains the vendorsetup.sh
          # then you need to clone your specific device tree in a separate step or adjust this copy.

      - name: Build TWRP
        run: |
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          ccache -s
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true # <--- ADD: from workflow 2
          lunch twrp_akita-userdebug && make clean && make recoveryimage -j$(nproc --all) # <--- ADD make clean for fresh build
          # The 'lunch' part should still be fine, as it implicitly sources vendorsetup.sh

      - name: Upload final recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image-akita
          path: ~/twrp/out/target/product/akita/recovery.img
